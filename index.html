<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07151b">
  <title>Fly Sunnah Admin</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#07151b;color:#fff}main{max-width:960px;margin:auto;padding:32px 20px}.brand{color:#57C5B6;font-weight:800;letter-spacing:2px}.hero{margin:28px 0}.hero h1{font-size:clamp(32px,7vw,56px);margin:8px 0}.muted{color:#9fb3ba}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{padding:20px;border:1px solid #1a5f7a;border-radius:18px;background:#10252d}.value{font-size:28px;font-weight:800;margin-top:8px}.footer{margin-top:28px;color:#78929a;font-size:13px}
  </style>
</head>
<body>
<main>
  <div class="brand">FLY SUNNAH / ADMIN</div>
  <section class="hero"><h1>Operations dashboard</h1><p class="muted">A clean frontend foundation for bookings, customers, documents and service operations.</p></section>
  <section class="grid" aria-label="Dashboard modules">
    <article class="card"><div class="muted">Bookings</div><div class="value">—</div></article>
    <article class="card"><div class="muted">Customers</div><div class="value">—</div></article>
    <article class="card"><div class="muted">Visa cases</div><div class="value">—</div></article>
    <article class="card"><div class="muted">Tasks</div><div class="value">—</div></article>
  </section>
  <div class="footer">Backend data is intentionally not fabricated. Connect the API before displaying live counts.</div>
</main>
</body>
</html>
